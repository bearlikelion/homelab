---
# Shared settings. Secrets belong in secrets.sops.yml, never here.

timezone: America/New_York

# Must match the host's media user, and the idmap in live/prod/node/main.tf.
media_uid: 13000
media_gid: 13000

base_domain: arneman.me
acme_email: mark@arneman.me

# --- Images -----------------------------------------------------------------
# Pinned deliberately: the previous setup drifted because everything tracked
# :latest (and radarr:nightly). Upgrades should be a reviewable one-line diff.

plex_image: lscr.io/linuxserver/plex:1.43.3
qbittorrent_image: lscr.io/linuxserver/qbittorrent:5.2.3
prowlarr_image: lscr.io/linuxserver/prowlarr:2.5.2
radarr_image: lscr.io/linuxserver/radarr:6.3.0
sonarr_image: lscr.io/linuxserver/sonarr:4.0.19
tautulli_image: lscr.io/linuxserver/tautulli:2.17.2
maintainerr_image: ghcr.io/maintainerr/maintainerr:3.9.0
ddns_image: favonia/cloudflare-ddns:1.15.1
adguard_image: adguard/adguardhome:v0.107.68
homepage_image: ghcr.io/gethomepage/homepage:v1.13.2
backrest_image: garethgeorge/backrest:v1.14.1
caddy_version: "2.11.4"

# --- Paths ------------------------------------------------------------------

stack_dir: /opt/media
edge_dir: /opt/edge
vpn_dir: /opt/vpn
backup_dir: /opt/backup
plex_stack_dir: /opt/plex
plex_config_dir: /opt/plex/config

# --- Ports ------------------------------------------------------------------

qbittorrent_port: 8080
qbittorrent_torrent_port: 6881
prowlarr_port: 9696
radarr_port: 7878
sonarr_port: 8989
tautulli_port: 8181
maintainerr_port: 6246

# --- Reverse proxy ----------------------------------------------------------

media_ip: 192.168.1.110
plex_ip: 192.168.1.120
edge_ip: 192.168.1.130
vpn_ip: 192.168.1.140
build_ip: 192.168.1.150
social_ip: 192.168.1.160
backup_ip: 192.168.1.170
clips_ip: 192.168.1.200

# Internal names, resolved by AdGuard and reachable only on the LAN or over the
# VPN. Purpose-based rather than app-based: what it does, not what runs it.
internal_domain: arneman.home
# Internal names are served over HTTPS with Caddy's local CA, because Authelia
# will not set session cookies over plain HTTP.
internal_domain_scheme: https

internal_services:
  - name: movies
    upstream: "{{ media_ip }}:{{ radarr_port }}"
  - name: tv
    upstream: "{{ media_ip }}:{{ sonarr_port }}"
  - name: downloads
    upstream: "{{ media_ip }}:{{ qbittorrent_port }}"
  - name: search
    upstream: "{{ media_ip }}:{{ prowlarr_port }}"
  - name: stats
    upstream: "{{ media_ip }}:{{ tautulli_port }}"
  - name: cleanup
    upstream: "{{ media_ip }}:{{ maintainerr_port }}"
  - name: plex
    upstream: "{{ plex_ip }}:32400"
  - name: home
    upstream: "{{ edge_ip }}:{{ homepage_port }}"
  - name: dns
    upstream: "{{ edge_ip }}:{{ adguard_port }}"
  # OpenVPN AS serves the admin UI over https only, so dialing it as plain
  # http returns 502.
  - name: vpn
    upstream: "{{ vpn_ip }}:{{ openvpn_web_port }}"
    upstream_tls: true
  - name: social
    upstream: "{{ social_ip }}:{{ postiz_port }}"
  # Also public as clips.{{ base_domain }}. The internal name is what actually
  # works on the LAN; Fireshare's DOMAIN stays the public one, because that is
  # the name that has to appear in a shared link's OpenGraph preview.
  - name: clips
    upstream: "{{ clips_ip }}:{{ fireshare_port }}"
  # The clip_maker review tool, on the same box. Internal only and deliberately
  # absent from public_services: its POST routes have no auth and write files,
  # and the clips it shows include the ones flagged for slurs.
  - name: review
    upstream: "{{ clips_ip }}:{{ review_port }}"
  - name: backup
    upstream: "{{ backup_ip }}:{{ backrest_port }}"
  # Proxmox serves https with its own self-signed cert, so Caddy has to dial
  # https and skip verification. pve is an alias for the same host.
  - name: proxmox
    upstream: "{{ pve_ip }}:8006"
    upstream_tls: true
  - name: pve
    upstream: "{{ pve_ip }}:8006"
    upstream_tls: true
  # Cockpit serves its own https and rejects a proxied websocket unless its
  # Origins list names this host; pve-cockpit-install.sh writes that.
  - name: cockpit
    upstream: "{{ pve_ip }}:9090"
    upstream_tls: true

# Public names with real certificates. Deliberately minimal: only Plex is
# exposed. Admin interfaces stay internal, reachable over the VPN instead.
public_services:
  - name: plex
    upstream: "{{ plex_ip }}:32400"
  # Public because a share link that only resolves on the LAN is not a share
  # link. Fireshare's own login gates uploads and the private feed.
  - name: clips
    upstream: "{{ clips_ip }}:{{ fireshare_port }}"

ddns_subdomain: home

adguard_port: 3000
homepage_port: 3001
backrest_port: 9898

dashboard_title: Arneman Home
pve_ip: 192.168.1.99
nas_ip: 192.168.1.11

# Fetched once at deploy time and served locally; an external URL adds ~1s to
# every page load.
homepage_background_source: https://picsum.photos/1920/1080?blur=2
homepage_background: /images/background.jpg
homepage_background_blur: sm
homepage_background_opacity: 25

quotes:
  - text: "Programs must be written for people to read, and only incidentally for machines to execute."
    author: Harold Abelson
  - text: "Simplicity is prerequisite for reliability."
    author: Edsger W. Dijkstra
  - text: "Premature optimization is the root of all evil."
    author: Donald Knuth
  - text: "Make it work, make it right, make it fast."
    author: Kent Beck
  - text: "The best code is no code at all."
    author: Jeff Atwood
  - text: "Weeks of coding can save you hours of planning."
    author: Unknown
  - text: "Everything should be made as simple as possible, but not simpler."
    author: Albert Einstein
  - text: "Talk is cheap. Show me the code."
    author: Linus Torvalds
  - text: "A game is a series of interesting choices."
    author: Sid Meier
  - text: "Perfection is achieved when there is nothing left to take away."
    author: Antoine de Saint-Exupery
  - text: "First, solve the problem. Then, write the code."
    author: John Johnson
  - text: "Deleted code is debugged code."
    author: Jeff Sickel

# Open-Meteo: no API key, no account, no credit card. OpenWeatherMap's One Call
# tier now requires a card on file even for the free bucket.
weather_label: Home
weather_latitude: 40.0583
weather_longitude: -74.4057
weather_units: imperial

# Login is admin / changeme. Change it in the web UI after first login, or
# replace this hash:
#   docker run --rm httpd:alpine htpasswd -B -n -b admin <password>
adguard_password_hash: "$2b$10$/nJn6Whuyu6QwO6VxbmZy.PeWTmf68FMFKkAWrvMDAaxFsVYbzXYa"

# --- Plex -------------------------------------------------------------------

# The P400 is passed in and the driver is on the host, so this is now just a
# switch. Hardware transcoding needs a Plex Pass; without one Plex ignores the
# GPU and falls back to CPU regardless.
plex_gpu: false

# Generate at https://plex.tv/claim right before deploying; valid 4 minutes.
#   ansible-playbook site.yml -e plex_claim=claim-xxxx
plex_claim: ""

# --- Secrets ----------------------------------------------------------------
# Scoped Cloudflare token: Zone:DNS:Edit + Zone:Zone:Read on this zone only.
# Pass with -e cloudflare_api_token=... or via the sops secrets file.
cloudflare_api_token: ""

# --- VPN --------------------------------------------------------------------

openvpn_image: openvpn/openvpn-as:3.2.2-413ca39f-Ubuntu24
openvpn_web_port: 943
openvpn_vpn_port: 1194
openvpn_tcp_port: 8443

# --- Build ------------------------------------------------------------------
# Bind mount from the fast pool. Source, artifacts and the ccache all live here
# so the container rootfs stays small and vzdump skips them.
build_root: /build

# 24 cores allocated, 22 used, leaving the box responsive during a build.
godot_build_jobs: 22
ccache_max_size: 50G

# --- Files (Samba) ----------------------------------------------------------
# tank/backup is not shared. A desktop that can write to the restic repositories
# is the ransomware path backups exist to survive.

files_ip: 192.168.1.190

samba_users:
  - mark

# Set true only after verifying the container can traverse .zfs/snapshot; an
# unprivileged LXC often cannot, and smbd then serves an empty version list.
samba_shadow_copy: false

# --- Social (Postiz) --------------------------------------------------------

postiz_image: ghcr.io/gitroomhq/postiz-app:v2.22.1
postiz_postgres_image: postgres:17-alpine
postiz_redis_image: redis:7-alpine
temporal_image: temporalio/auto-setup:1.28.1
temporal_postgres_image: postgres:16
temporal_elasticsearch_image: elasticsearch:7.17.27
postiz_port: 5000
social_dir: /opt/social
# Leave false for the first deploy so you can create an account, then flip it.
postiz_disable_registration: false

# --- Clips (Fireshare) ------------------------------------------------------
# The CUDA image rather than -lite: -lite drops the NVENC build of ffmpeg and
# silently ignores TRANSCODE_GPU.

fireshare_image: shaneisrael/fireshare:1.7.6
fireshare_port: 8080
clips_dir: /opt/clips
clips_media_dir: /srv/clips

fireshare_admin_user: carina
fireshare_scan_minutes: 5
# 0 takes the first frame. A Holdfast clip usually opens mid-action, so the
# first frame makes a better poster than the midpoint of an edited-down clip.
fireshare_thumbnail_location: 0

# Generates 720p/1080p variants so a shared link plays for someone on a phone
# without pulling the full-quality original.
fireshare_transcoding: true

# h264 rather than auto. auto tries AV1 NVENC on every clip before falling back,
# and the P400 cannot encode AV1, so each attempt is a guaranteed failure that
# still costs an ffmpeg spawn. h264 asks for h264_nvenc with a CPU fallback.
fireshare_encoder_preference: h264

# The public feed is the whole library, not a per-clip opt-in. Fireshare's own
# default is private; this flips it for newly scanned clips.
fireshare_video_private: false

# --- GPU --------------------------------------------------------------------
# Quadro P400 (GP107) at 83:00.0. Passed into plex and clips by the modules in
# live/prod/node/main.tf; these flags decide whether the workload asks for it.
#
# NVENC generation 6: H.264 and HEVC encode. AV1 needs Ada or newer, so
# Fireshare picks h264_nvenc.

fireshare_gpu: true

# --- Clip review UI ---------------------------------------------------------
# review/server.mjs from ~/dev/clip_maker, run straight off a stock node image.
# It has no npm dependencies, so there is nothing to build and no image to
# maintain; the desktop publishes the code and the data together with
# `npm run review:push`.

review_image: node:22-bookworm-slim
review_port: 8081
review_dir: "{{ clips_media_dir }}/clip_maker/review"

# Unprivileged inside the container, so it cannot bind 80.
review_internal_port: 5178

# --- Darkfall (game server cluster) ------------------------------------------
# Seven native Linux nodes plus Postgres, the topology in OGDarkfall's
# ServerLayout.xml. Internal only: nothing here is published.

darkfall_ip: 192.168.1.180
darkfall_dir: /srv/darkfall
darkfall_stage_dir: "{{ darkfall_dir }}/stage"
darkfall_dfdata_dir: "{{ darkfall_dir }}/dfdata"
darkfall_log_dir: "{{ darkfall_dir }}/logs"

# Built on the workstation by UWDK, which is the control node for this play.
darkfall_source: /mnt/SSD/Darkfall/src/OGDarkfall
darkfall_ogdata: /mnt/SSD/Darkfall/OGData

# Ceilings, not reservations: the sum oversubscribes the container's 8 cores on
# purpose so a well-behaved node is never throttled.
darkfall_nodes:
  - name: dbserver
    cpus: "0.5"
    memory: 2g
  - name: gamelogicdist
    cpus: "1.0"
    memory: 2g
  # Native C++: loads the zone terrain and collision into native memory at init.
  - name: engine
    cpus: "2.0"
    memory: 6g
  - name: gamelogic
    cpus: "1.5"
    memory: 6g
  # Heap is modest, but the full_agon navmesh adds ~3.5G off-heap once spawning starts.
  - name: aigamelogic
    cpus: "2.0"
    memory: 8g
  - name: statsserver
    cpus: "1.0"
    memory: 2g
  - name: frontend
    cpus: "1.0"
    memory: 2g

darkfall_stage_trees:
  - SDK/jdk/linux-x64
  - Build/Server/recast
  - Build/ExternalDLL
  - ThirdParty/ExternalDLL
  - docker/configs
  - deploy/pg

darkfall_stage_files:
  - Build/Server/dfserver.jar
  - Scripts/generate_sfai.py
  - docker/Dockerfile.runtime-base
  - docker/node-entrypoint.sh
  - docker/mgmt-watchdog.sh

# The one image the cluster runs. Every node is the same base plus a
# bind-mounted binary, so shipping a build is an rsync and a restart instead of
# seven image builds and a cold recreate.
darkfall_base_image: darkfall/server-base
darkfall_base_tag: latest

# Assembled flat into {{ darkfall_stage_dir }}/jars, because the classpath baked
# into each node's <node>.xml VMOption names /opt/darkfall/jars/<file>.jar
# directly. xstream-fix.jar is deliberately absent: it is a 1.2.2-era patch whose
# stale JVM.class shadows xstream 1.4.21's complete one (NoSuchMethodError
# isVersion), and mDF dropped it when moving to 1.4.21.
darkfall_jars:
  - Build/Server/dfserver.jar
  - Build/ExternalDLL/xstream-1.4.21.jar
  - Build/ExternalDLL/commons-collections-3.2.jar
  - ThirdParty/ExternalDLL/recast-1.5.12.jar
  - ThirdParty/ExternalDLL/detour-1.5.12.jar

# Read-only and identical for every node. The per-node binary and config are
# added by the compose template.
darkfall_node_mounts:
  - "{{ darkfall_stage_dir }}/jars:/opt/darkfall/jars:ro"
  - "{{ darkfall_stage_dir }}/Build/Server/recast:/opt/darkfall/recast:ro"
  - "{{ darkfall_stage_dir }}/docker/node-entrypoint.sh:/opt/darkfall/node-entrypoint.sh:ro"
  - "{{ darkfall_dfdata_dir }}:/data/dfdata:ro"
  - "{{ darkfall_dir }}/dfdata.sfai:/data/dfdata.sfai:ro"

# Client-side trees. texture is 75G and .git is 85G of LFS objects, against a
# 128G volume; what is left is the ~18G the nodes actually read.
darkfall_dfdata_excludes:
  - .git
  - texture
  - audio
  - shaders-cache
  - worldbuilder

darkfall_postgres_image: postgres:17-alpine
darkfall_watchdog_image: docker:cli

darkfall_db_user: dfserver
darkfall_db_password: dfserver
darkfall_db_name: darkfall
darkfall_db_port: 5432

darkfall_client_port: 21000
darkfall_server_port: 10001
darkfall_admin_port: 1111

# Must stay 172.28.0.0/24: assemble-configs.sh bakes 172.28.0.255 into every
# node config as the UDP discovery broadcast address.
darkfall_subnet: 172.28.0.0/24

darkfall_startup_grace: 300

# Read-only status page: is the cluster ready, or still booting? The frontend
# accepts TCP well before the cluster reaches asRun, so "port is open" is not a
# readiness signal and this reports the real per-node state instead.
darkfall_status_image: python:3.13-alpine
darkfall_status_port: 8080
