---
- name: Base configuration for every container
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Ensure keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

  roles:
    - common
    - docker

- name: Deploy the media stack
  hosts: media
  become: true
  roles:
    - media_stack

- name: Deploy Plex
  hosts: plex
  become: true
  roles:
    - role: nvidia
      when: plex_gpu
    - plex

- name: Deploy the edge proxy
  hosts: edge
  become: true
  roles:
    - edge

- name: Deploy the VPN
  hosts: vpn
  become: true
  roles:
    - vpn

- name: Deploy Postiz
  hosts: social
  become: true
  roles:
    - social

- name: Deploy the backup UI
  hosts: backup
  become: true
  roles:
    - backup

- name: Deploy the clip share
  hosts: clips
  become: true
  roles:
    # Fireshare transcodes on the P400, so the userspace driver has to be in
    # place before the stack starts.
    - role: nvidia
      when: fireshare_gpu
    - clips

- name: Deploy the Darkfall server cluster
  hosts: darkfall
  become: true
  roles:
    - darkfall

# The same container doubles as the build rack. It is x86-64 where the AWS node
# holding Forgejo is arm64, so this is where the game compiles. Forgejo is only
# reachable over the mesh, so tailscale has to come first.
- name: Deploy the build rack
  hosts: darkfall
  become: true
  # Tagged so the rack can be deployed without the darkfall role re-walking the
  # 19G dfdata push first.
  tags: rack
  roles:
    - tailscale
    - forgejo_runner

# Forgejo, the git server. Deliberately not on the build box: the runner there
# drives the host Docker daemon, and the repositories are the one thing on this
# host that cannot be regenerated.
- name: Deploy Forgejo
  hosts: code
  become: true
  roles:
    - forgejo

- name: Deploy Penpot
  hosts: design
  become: true
  roles:
    - penpot

- name: Deploy Foundry VTT
  hosts: foundry
  become: true
  roles:
    - foundry

# The runner registers against the play above, so that one has to have run.
- name: Deploy the build box
  hosts: build
  become: true
  roles:
    - build
    - role: build_runner
      tags: runner

- name: Deploy the file shares
  hosts: files
  become: true
  roles:
    - samba

# The Pelican panel and its Wings daemon. The only KVM guest here: Wings sets
# cgroup and memory limits on the containers it launches, which an unprivileged
# LXC is not permitted to do.
- name: Deploy the game server panel
  hosts: pelican
  become: true
  roles:
    - pelican

# The WotLK server. Reads its build straight from build's artifacts, so the
# azerothcore workflow has to have published one first.
- name: Deploy AzerothCore
  hosts: azcore
  become: true
  roles:
    - azerothcore
