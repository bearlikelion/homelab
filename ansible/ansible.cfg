[defaults]
vars_plugins_enabled = host_group_vars,community.sops.sops
inventory = inventory.yml
host_key_checking = False
# Surfaces the deprecation noise only when it matters.
deprecation_warnings = False

[inventory]
enable_plugins = yaml, ini

# Decrypts *.sops.yml under group_vars automatically, so the Cloudflare token
# never has to be passed with -e.
