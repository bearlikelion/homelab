---
# Caddy (reverse proxy + TLS), AdGuard Home (local DNS + ad blocking), the
# dynamic DNS updater, and the Homepage dashboard.

- name: Fail early without a Cloudflare token
  ansible.builtin.assert:
    that:
      - cloudflare_api_token | default('') | length > 0
    fail_msg: >-
      cloudflare_api_token is not set. Create a scoped token with
      Zone:DNS:Edit + Zone:Zone:Read limited to {{ base_domain }}, then pass it
      with -e cloudflare_api_token=... or put it in the sops secrets file.

- name: Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ edge_dir }}"
    - "{{ edge_dir }}/adguard/work"
    - "{{ edge_dir }}/adguard/conf"
    - "{{ edge_dir }}/homepage"
    - "{{ edge_dir }}/homepage/images"
    - "{{ edge_dir }}/ca"

# Debian resolvers bind :53, which AdGuard needs.
- name: Free port 53 from systemd-resolved
  block:
    - name: Disable the stub listener
      ansible.builtin.copy:
        content: |
          [Resolve]
          DNSStubListener=no
        dest: /etc/systemd/resolved.conf.d/adguard.conf
        mode: "0644"
      register: resolved_conf

    - name: Restart systemd-resolved
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted
      when: resolved_conf.changed
  rescue:
    - name: systemd-resolved not present, nothing to free
      ansible.builtin.debug:
        msg: "systemd-resolved absent; port 53 assumed free"

- name: Render Dockerfile
  ansible.builtin.template:
    src: Dockerfile.j2
    dest: "{{ edge_dir }}/Dockerfile"
    mode: "0644"
  register: edge_dockerfile

- name: Render Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ edge_dir }}/Caddyfile"
    mode: "0644"
  register: edge_caddyfile

# AdGuard rewrites this file at runtime, so only the rewrites block is managed
# here. Everything else is left to the web UI.
- name: Seed AdGuard config
  ansible.builtin.template:
    src: adguard.yaml.j2
    dest: "{{ edge_dir }}/adguard/conf/AdGuardHome.yaml"
    mode: "0644"
    force: false

- name: Set internal DNS rewrites
  ansible.builtin.replace:
    path: "{{ edge_dir }}/adguard/conf/AdGuardHome.yaml"
    regexp: '^(  rewrites:) \[\]$'
    replace: |-
      \1
      {% for svc in internal_services %}
        - domain: {{ svc.name }}.{{ internal_domain }}
          answer: {{ edge_ip }}
          enabled: true
      {% endfor %}
        - domain: ca.{{ internal_domain }}
          answer: {{ edge_ip }}
          enabled: true
        - domain: '*.{{ internal_domain }}'
          answer: {{ edge_ip }}
          enabled: true
  register: adguard_rewrites

- name: Restart AdGuard when rewrites changed
  community.docker.docker_compose_v2:
    project_src: "{{ edge_dir }}"
    services: [adguard]
    state: restarted
  when: adguard_rewrites.changed

# Fetched once and served locally. Pointing the background at an external URL
# costs a redirect chain plus a ~1s image fetch on every page load.
- name: Fetch the dashboard background
  ansible.builtin.get_url:
    url: "{{ homepage_background_source }}"
    dest: "{{ edge_dir }}/homepage/images/background.jpg"
    mode: "0644"
    timeout: 30
  ignore_errors: true

# Same quote all day: index by day-of-year rather than at random.
- name: Pick the quote of the day
  ansible.builtin.set_fact:
    quote_of_the_day: "{{ quotes[ ((now().timetuple().tm_yday | int) % (quotes | length)) ] }}"

- name: Render Homepage config
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ edge_dir }}/homepage/{{ item }}"
    mode: "0644"
  loop:
    - settings.yaml
    - services.yaml
    - widgets.yaml
    - custom.css
  register: homepage_config

- name: Render compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ edge_dir }}/docker-compose.yml"
    mode: "0644"
  register: edge_compose

# The token reaches the containers through this file, never the compose file.
- name: Write the environment file
  ansible.builtin.copy:
    content: "CF_API_TOKEN={{ cloudflare_api_token }}\n"
    dest: "{{ edge_dir }}/.env"
    mode: "0600"
  no_log: true

- name: Build and start
  community.docker.docker_compose_v2:
    project_src: "{{ edge_dir }}"
    state: present
    build: policy
    pull: missing

- name: Restart when config changed
  community.docker.docker_compose_v2:
    project_src: "{{ edge_dir }}"
    state: restarted
  when: >-
    edge_dockerfile.changed or edge_caddyfile.changed
    or edge_compose.changed or homepage_config.changed

- name: Wait for Caddy
  ansible.builtin.wait_for:
    port: 443
    host: 127.0.0.1
    timeout: 180

- name: Wait for AdGuard DNS
  ansible.builtin.wait_for:
    port: 53
    host: 127.0.0.1
    timeout: 60

# Proves the whole naming design end to end.
- name: Verify an internal name resolves to the proxy
  ansible.builtin.shell: >
    getent hosts movies.{{ internal_domain }} ||
    dig +short @127.0.0.1 movies.{{ internal_domain }}
  register: dns_check
  changed_when: false
  failed_when: false

- name: Report DNS result
  ansible.builtin.debug:
    msg: "movies.{{ internal_domain }} -> {{ dns_check.stdout | default('no answer') }}"

# Devices need this root installed once to trust the .home names. Without it
# browsers warn, and Authelia's session cookie will not stick.
- name: Copy out the local CA root
  ansible.builtin.fetch:
    src: "{{ edge_dir }}/caddy-data/caddy/pki/authorities/local/root.crt"
    dest: "{{ playbook_dir }}/../caddy-root-ca.crt"
    flat: true
  ignore_errors: true
  register: ca_root

- name: Publish the CA root for other devices
  ansible.builtin.copy:
    src: "{{ edge_dir }}/caddy-data/caddy/pki/authorities/local/root.crt"
    dest: "{{ edge_dir }}/ca/caddy-root-ca.crt"
    remote_src: true
    mode: "0644"
  ignore_errors: true

- name: How to trust the internal names
  ansible.builtin.debug:
    msg:
      - "CA root saved to caddy-root-ca.crt in the repo root."
      - "Install it on each device to trust *.{{ internal_domain }}:"
      - "  linux: sudo cp caddy-root-ca.crt /usr/local/share/ca-certificates/ && sudo update-ca-certificates"
      - "  arch:    sudo cp caddy-root-ca.crt /etc/ca-certificates/trust-source/anchors/ && sudo trust extract-compat"
      - "  firefox: Settings > Certificates > View Certificates > Import"
      - "  other devices: http://ca.{{ internal_domain }}/caddy-root-ca.crt"
  when: ca_root is succeeded

# Issuance is asynchronous, so surface failures rather than letting the play
# look successful while every request serves an untrusted certificate.
- name: Check for certificate errors
  ansible.builtin.shell: >
    docker logs caddy 2>&1 | grep -iE "error|failed" | tail -5 || true
  register: caddy_errors
  changed_when: false

- name: Report certificate errors
  ansible.builtin.debug:
    msg: "{{ caddy_errors.stdout_lines | default([]) }}"
  when: caddy_errors.stdout | length > 0
