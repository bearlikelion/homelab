---
# Foundry VTT, public at foundry.{{ base_domain }} through the GCP tunnel.

- name: Fail early without Foundry credentials
  ansible.builtin.assert:
    that:
      - foundry_username | default('') | length > 0
      - foundry_password | default('') | length > 0
      - foundry_admin_key | default('') | length > 0
    fail_msg: >-
      foundry_username, foundry_password (your foundryvtt.com account, used to
      download the licensed build) and foundry_admin_key must be in the sops
      secrets file.

# The bind mount from fast/foundry, shared with Samba. Foundry refuses to start
# if it cannot write here.
- name: Own the data directory as the media identity
  ansible.builtin.file:
    path: "{{ foundry_dir }}/data"
    state: directory
    owner: "{{ media_uid }}"
    group: "{{ media_gid }}"
    mode: "0775"
  register: foundry_data

- name: Write the environment file
  ansible.builtin.copy:
    content: |
      FOUNDRY_USERNAME={{ foundry_username }}
      FOUNDRY_PASSWORD={{ foundry_password }}
      FOUNDRY_ADMIN_KEY={{ foundry_admin_key }}
    dest: "{{ foundry_dir }}/.env"
    mode: "0600"
  register: foundry_env
  no_log: true

- name: Render compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ foundry_dir }}/docker-compose.yml"
    mode: "0644"
  register: foundry_compose

- name: Install the module installer
  ansible.builtin.copy:
    src: foundry-modules.py
    dest: /usr/local/bin/foundry-modules
    mode: "0755"

# Paid Patreon links, so the list lives in sops and stays out of the log.
- name: Write the module manifest list
  ansible.builtin.copy:
    content: "{{ foundry_module_manifests | default([]) | join('\n') }}\n"
    dest: "{{ foundry_dir }}/module-manifests.txt"
    mode: "0600"
  no_log: true

- name: Install or update modules from their manifests
  ansible.builtin.command: >-
    /usr/local/bin/foundry-modules install {{ foundry_dir }}/module-manifests.txt
    {{ foundry_dir }}/data/Data {{ media_uid }} {{ media_gid }}
  register: foundry_modules
  changed_when: "'installed' in foundry_modules.stdout or 'patched' in foundry_modules.stdout"

- name: Report modules
  ansible.builtin.debug:
    var: foundry_modules.stdout_lines

- name: Start Foundry
  community.docker.docker_compose_v2:
    project_src: "{{ foundry_dir }}"
    state: present
    pull: missing

# Foundry only discovers hand-installed modules at startup.
- name: Restart when config or modules changed
  community.docker.docker_compose_v2:
    project_src: "{{ foundry_dir }}"
    state: restarted
  when: >-
    foundry_compose.changed or foundry_env.changed or foundry_data.changed
    or foundry_modules.changed

# The first start downloads the ~200 MB distribution before it listens.
- name: Wait for the web interface
  ansible.builtin.wait_for:
    port: "{{ foundry_port }}"
    host: 127.0.0.1
    timeout: 600

# Quick-Starts a world per adventure module that has none yet. Skipped while a
# game is running, so a deploy never kicks players out.
- name: Create a world for each adventure module
  ansible.builtin.command: >-
    /usr/local/bin/foundry-modules worlds {{ foundry_dir }}/data/Data
    {{ foundry_world_system }} {{ foundry_dir }}/.env http://127.0.0.1:{{ foundry_port }}
  register: foundry_worlds
  changed_when: "'created world' in foundry_worlds.stdout"

- name: Report worlds
  ansible.builtin.debug:
    var: foundry_worlds.stdout_lines
