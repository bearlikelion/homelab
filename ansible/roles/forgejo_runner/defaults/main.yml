---
# Forgejo Actions runner. The rack is x86-64 and the AWS node holding Forgejo is
# arm64, so this is where the game actually compiles. See docs/ci.md in the aws
# repo for the full design.

forgejo_runner_url: https://code.odin.projectgamephoenix.com
forgejo_runner_name: "{{ inventory_hostname }}"

# Single-use: registering consumes it, so it is passed at deploy time rather
# than kept in sops. Mint one with the aws repo's `scripts/runner-token.sh`:
#   ansible-playbook site.yml -e forgejo_runner_token=...
# Only read on the first run; after that the .runner file is the credential.
forgejo_runner_token: ""

# rack-x64 runs a job in the builder image. rack-host runs it in the runner
# container itself, which is how deploy-internal.yml drives the cluster.
forgejo_runner_labels:
  - "rack-x64:docker://{{ forgejo_builder_image }}"
  - "rack-host:host"

forgejo_runner_version: "13.0.0"
forgejo_runner_base_image: "code.forgejo.org/forgejo/runner:{{ forgejo_runner_version }}"

# The stock runner image is bare Alpine: no docker client and no rsync, both of
# which a rack-host job shells out to. The daemon runs from a thin derivative
# that adds them.
forgejo_runner_image: darkfall/forgejo-runner
forgejo_runner_tag: "{{ forgejo_runner_version }}"

forgejo_builder_name: pgp/builder
forgejo_builder_tag: latest
forgejo_builder_image: "{{ forgejo_builder_name }}:{{ forgejo_builder_tag }}"

# One job at a time: a build uses all 8 cores, so a concurrent second one only
# makes both slower, and the game cluster shares the box.
forgejo_runner_capacity: 1
forgejo_runner_job_timeout: 3h

# Control-node checkout of the aws repo. The helper scripts and the builder
# image are pushed from it rather than duplicated here, the same way the
# darkfall role ships build artifacts from OGDarkfall.
rack_source: /mnt/SSD/Darkfall/src/aws

# On the 128G bind mount, not the 32G rootfs: the warm repo cache is ~50G of
# submodule history and a client build is multi-gigabyte.
rack_dir: "{{ darkfall_dir }}/ci"
rack_builds_dir: "{{ darkfall_dir }}/builds"

# A job container may bind only what is listed here, and the default is nothing.
# The build workflows mount all three.
forgejo_runner_valid_volumes:
  - "{{ rack_dir }}/cache"
  - "{{ rack_dir }}/scripts"
  - "{{ rack_builds_dir }}"
